apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketing-deployment
  labels:
    app: ticketing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticketing
  template:
    metadata:
      labels:
        app: ticketing
    spec:
      containers:
      - name: ticketing
        image: softwarehub-ticketing:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ticketing-service
spec:
  type: NodePort
  selector:
    app: ticketing
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30007
